[project]
name = "performance-management-framework"
version = "0.1.0"
description = "绩效管理平台 —— 后端 / 前端 / 智能体服务"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".git",
    "__pycache__",
    "frontend",
    "node_modules",
    "backend/backup",
    "backend/data",
    # ⚠️ 临时探针/调试脚本（tmp_* / _probe_* / _verify_* 等）——
    #    它们是**未跟踪的一次性文件**，随用随删。
    #    排除它们，避免「有人正在调试时 CI 突然红了」——
    #    门禁应该只对**要交付的代码**负责。
    #
    # ⚠️ 这里只排「下划线开头」的一次性脚本。
    #    `check_*.py` / `probe_*.py` **不排** —— 它们是被跟踪的正式交付物
    #    （backend/check_*.py、backend/scripts/check_*.py），
    #    其中 check_schema_drift.py 更是 CI 步骤之一，排掉等于门禁失守。
    "tmp_*.py",
    "_probe_*.py",
    "_verify_*.py",
    "_fix_*.py",
    "_dbg_*.py",
    "_r6_*.py",
    "_acceptance_*.py",
    "_check_*.py",
    "_selfcheck_*.py",
    # ⚠️ feishu/ —— 本地飞书 Go SDK 试验目录（IDE scratch project）。
    #    `feishu/feishu.py` 实际是 **Go 源码**（`package main` +
    #    larksuite/oapi-sdk-go），只是被误存成了 .py 扩展名。
    #    排掉它，Ruff 才不会对着 Go 语法报一堆 invalid-syntax。
    "feishu",
]

[tool.ruff.lint]
# 规则集：E（pycodestyle）+ F（pyflakes）+ W（whitespace）+ I（import 排序）
#        + UP（pyupgrade）+ B（bugbear）
#
# ⚠️ R22：这套规则集**已在 CI 中启用**（见 .github/workflows/ci.yml 与
#    backend/scripts/run_ci_locally.py）。
#    历史背景：CI 之前只跑 `--select E9,F63,F7,F82`（仅致命错误），
#    导致 1200+ 条存量违规无人问津 —— 包括两个真实的 `F821`
#    （未定义名）与一处**上传文件类型校验缺失**（伪装文件放行）。
#
#    分批推进顺序（docs/11-待完善清单.md CI-3）：F → I → B → E/W/UP。
#    已全部完成并清零。
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",    # 行长度由 formatter 管
    "B008",    # FastAPI 的 Depends() 在默认值里是标准写法
    "B904",    # raise ... from 在本项目不是强制
]

[tool.ruff.lint.per-file-ignores]
# 测试文件允许更宽松
"backend/app/tests/*" = ["E402", "F401", "F811", "B017"]
"agent-service/tests/*" = ["E402", "F401", "F811", "B017"]
# 迁移脚本由 Alembic 管理
"backend/migrations/*" = ["E402", "F401", "E501"]
# ⚠️ 运维脚本：E402 是**刻意**的 —— 它们必须先把 backend/ 塞进 sys.path，
#    才能 import `app.*`（否则 `ModuleNotFoundError`）。
#    这不是「代码放错位置」，是脚本运行方式的固有限制。
"backend/scripts/check_feishu.py" = ["E402"]
"backend/scripts/verify_result_submission_e2e.py" = ["E402"]
"backend/scripts/_verify_r6_snapshot_freeze.py" = ["E402"]
# ⚠️ MAIN_PY_ADDITIONS.py 是**代码片段文件**，不是可运行模块：
#    它的内容是「要粘进 main.py 末尾」的路由定义，
#    因此 `@app.post(...)` 里的 app / schemas / models / Depends / Session
#    等名字**只在 main.py 内部存在** → 83 个 F821 是必然的，不是 bug。
#    同理它不该参与 import 排序（I001）与未使用导入判定。
"MAIN_PY_ADDITIONS.py" = ["F821", "F401", "I001", "E402", "E401"]

[tool.pytest.ini_options]
# ⚠️ 这里**必须同时包含 agent-service/tests**。
#
# 此前只写 backend/app/tests —— 从仓库根目录跑 pytest 时，
# L3 会被**静默跳过**（不报错、不执行），让人误以为"全量已跑"。
# CI 的 agent-service 作业用 working-directory 单独跑，所以那条路径没漏；
# 但本地开发者从根目录跑时，L3 长期处于无保护状态。
testpaths = ["backend/app/tests", "agent-service/tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
