name: CI

# ─────────────────────────────────────────────────────────────
# 每次 push / PR 自动执行「契约校验 + 后端测试 + 前端类型检查 + 前端测试」。
#
# 设计目标：
#   1. 本地绿灯 ≠ 线上绿灯 —— 同一套命令在 CI 里再跑一遍；
#   2. 契约脱节必须立即暴露（后端新增/改名端点但前端没跟上 → 直接红）；
#   3. **零失败硬门槛** —— 前端测试不允许任何失败（2026-11-16 起）。
#      此前用基线文件锁定 10 个历史遗留失败，基线已全部修完并删除，
#      往后新增任何失败都直接让 CI 变红。
#
# 注意：本仓库**没有** `.github/workflows` 目录，本文件是首个 CI 定义。
# ─────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  # 手动触发，方便排查
  workflow_dispatch:

# 同分支的后续 push 自动取消上一个未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────
  # 后端：契约校验 + pytest + 迁移往返 + schema 校验
  # ───────────────────────────────────────────────────────────
  backend:
    name: 后端（契约校验 / 测试 / 迁移）
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: 准备 CI 数据库目录
        run: |
          mkdir -p data
          # ⚠️ 必须用绝对路径：
          #    应用（仓库根运行）会把相对路径解析到 <root>/data/，
          #    而 Alembic（backend/ 目录运行）会解析到 <root>/backend/data/。
          #    两者指向不同文件会让 schema 校验查空库。
          echo "DATABASE_URL=sqlite:///${{ github.workspace }}/data/_ci_backend.db" >> "$GITHUB_ENV"
          # 关闭自动建表 —— schema 交给 Alembic 管理
          echo "AUTO_CREATE_TABLES=false" >> "$GITHUB_ENV"
          # CI 无需真实模型与飞书凭据
          echo "MODEL_MODE=echo" >> "$GITHUB_ENV"
          echo "FEISHU_SYNC_ENABLED=false" >> "$GITHUB_ENV"

      - name: API 契约校验（严格模式）
        # 前后端端点对不上即失败：这是防止契约脱节的第一道闸门
        run: python backend/scripts/check_api_contract.py --strict

      - name: 后端单元与集成测试
        run: python -m pytest backend/app/tests -q --tb=short -p no:cacheprovider

      - name: Alembic 迁移 —— 升级到 head
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Alembic 迁移 —— 校验版本
        working-directory: backend
        run: |
          python -m alembic current
          python -m alembic heads

      - name: Alembic 迁移 —— 降级再升级（往返无损）
        working-directory: backend
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head

      - name: 数据库 schema 校验（阶段三 9 张新表）
        run: python backend/scripts/verify_phase3_schema.py "${{ github.workspace }}/data/_ci_backend.db"

      - name: Schema 漂移检测（ORM 模型 ↔ 迁移）
        # ⚠️ 为什么需要这一步：
        #   本仓库有两条建库路径 —— alembic upgrade head（按迁移建）
        #   与 Base.metadata.create_all()（按 ORM 模型建）。
        #   ORM 模型漏声明某个 UniqueConstraint 时，两条路径会分叉，
        #   而 CI 只验了 alembic 那条 → **天然看不见漂移**。
        #
        #   这真的发生过：0001_baseline.py 早已声明 uq_score_record，
        #   但 ORM 的 Score 模型漏了 → 真实运行库（create_all 建的）
        #   一直没有这个约束 → 并发算分写出重复 Score 行 →
        #   之后所有 scalar_one_or_none() 读路径（算分/详情/结果页）全 500。
        #
        #   本步骤用 ORM 建一个临时库，与迁移建的库逐表比对唯一约束。
        run: python backend/scripts/check_schema_drift.py "${{ github.workspace }}/data/_ci_backend.db"

      - name: Python 静态检查（ruff）
        # ⚠️ R22：规则集从 `--select E9,F63,F7,F82`（仅致命错误）
        #    收紧为 pyproject.toml 里配置的完整规则集：
        #    E（pycodestyle）+ F（pyflakes）+ W（whitespace）
        #    + I（import 排序）+ UP（pyupgrade）+ B（bugbear）。
        #
        #    为什么收紧：窄规则集让 1200+ 条存量违规长期无人问津，
        #    其中藏着两个真实的 `F821`（未定义名）和一处**上传文件
        #    类型校验缺失**（伪装文件可直接放行）。
        #    存量已按 F → I → B → E/W/UP 分批清零，现在可以硬门槛。
        #
        #    规则集与豁免清单统一在 pyproject.toml 的 [tool.ruff.lint]，
        #    本地 `backend/scripts/run_ci_locally.py` 用同一份配置。
        #
        # ⚠️⚠️ **不传 `--select`** —— 一旦在这里写死规则集，
        #    就会和 pyproject.toml 的 select 悄悄分叉（这正是 R22
        #    要根治的老毛病）。这里**只给路径**，规则集由配置文件唯一决定。
        #
        # ⚠️ 覆盖范围也补齐了：原来只查 `backend/app backend/scripts`，
        #    而 `backend/` 根目录的脚本（import_guide / probe_* 等）
        #    和 `agent-service/` 整个服务都在**门禁之外** ——
        #    同样是「代码在仓库里，但门禁管不到」。
        #
        #    `.` 也一并纳入 —— 仓库根目录还有几个手动脚本
        #    （BLOCK1_* / diagnose / run_tests 等），
        #    它们同样该被静态检查管住。
        run: ruff check . --output-format=github

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-report
          path: backend/.pytest_cache/
          retention-days: 7
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────
  # 智能体服务：独立 FastAPI 服务，单独测试
  # ───────────────────────────────────────────────────────────
  agent-service:
    name: 智能体服务测试
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent-service/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r agent-service/requirements.txt
          pip install pytest httpx ruff

      - name: 运行测试
        working-directory: agent-service
        run: python -m pytest tests -q --tb=short -p no:cacheprovider

      - name: Python 静态检查（ruff）
        # ⚠️ R22：智能体服务此前**完全没有** ruff 门禁 ——
        #    而它是独立部署的服务，代码质量没人守。
        #
        #    规则集同样由 pyproject.toml 唯一决定（这里不传 --select），
        #    与后端作业保持一致 —— 避免出现两套规则集。
        run: ruff check agent-service --output-format=github

  # ───────────────────────────────────────────────────────────
  # 前端：类型检查 + 单元测试 + 构建
  # ───────────────────────────────────────────────────────────
  frontend:
    name: 前端（类型检查 / 测试）
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: TypeScript 类型检查
        # vue-tsc 是前端的第一道闸门：类型错误必须在提交前暴露
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: 前端单元测试（零失败硬门槛）
        # ⚠️ 2026-11-16：从「基线感知」改为**零失败硬门槛**。
        #
        #    此前用 `scripts/run-tests-with-baseline.mjs` + `tests-baseline.json`
        #    锁定 10 个历史遗留失败（失败数 ≤ 基线即绿）。
        #    那套机制的问题：**基线本身会掩盖新问题**，
        #    且基线里的 10 条长期躺在那里没人修 —— 技术债静默固化。
        #
        #    现已全部修完（10 个失败 → 0），基线机制删除。
        #    往后新增任何失败都会直接让 CI 变红。
        #
        #    ⚠️ 必须直接跑 `node --test`（不能用 shell 通配符 ——
        #    Windows 下 `shell: true` 不会展开 glob；
        #    node --test 自身支持目录参数，跨平台行为一致）。
        working-directory: frontend
        run: node --experimental-strip-types --test tests/*.test.ts

      - name: 构建产物
        working-directory: frontend
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: ignore
